name: "Web App Security Skill"
description: "Audit authorized crawl boundaries or source projects with reproducible, explainable evidence."
author: "parousia8888"
branding:
  icon: "shield"
  color: "red"
inputs:
  mode:
    description: "Audit mode: crawl or source"
    default: "crawl"
  site:
    description: "Authorized http(s) origin required in crawl mode"
    default: ""
  acknowledge-authorization:
    description: "Must be true in crawl mode to confirm ownership or written authorization"
    default: "false"
  project:
    description: "Project directory in source mode; dependencies are not installed or executed"
    default: "."
  adapters:
    description: "Comma-separated source/deployment adapters: builtin, checkov, gitleaks, opengrep, osv, or all"
    default: "builtin"
  adapter-timeout:
    description: "External source adapter timeout in seconds"
    default: "120"
  acknowledge-alert-policy:
    description: "Allow selected external adapter findings to use the configured source gate"
    default: "false"
  output-dir:
    description: "Report directory"
    default: "webapp-security-report"
  fail-on:
    description: "Security and supply-chain threshold: high, medium, low, or never"
    default: "high"
  fail-on-domain:
    description: "Optional domain-specific override such as search_discoverability=high"
    default: ""
  active-probe:
    description: "Probe common sensitive paths; disabled by default"
    default: "false"
  allow-private-network:
    description: "Allow an explicitly selected localhost or private-network crawl origin"
    default: "false"
runs:
  using: "composite"
  steps:
    - name: "Run selected audit"
      shell: "bash"
      env:
        INPUT_SITE: "${{ inputs.site }}"
        INPUT_MODE: "${{ inputs.mode }}"
        INPUT_ACKNOWLEDGE_AUTHORIZATION: "${{ inputs.acknowledge-authorization }}"
        INPUT_PROJECT: "${{ inputs.project }}"
        INPUT_ADAPTERS: "${{ inputs.adapters }}"
        INPUT_ADAPTER_TIMEOUT: "${{ inputs.adapter-timeout }}"
        INPUT_ACKNOWLEDGE_ALERT_POLICY: "${{ inputs.acknowledge-alert-policy }}"
        INPUT_OUTPUT_DIR: "${{ inputs.output-dir }}"
        INPUT_FAIL_ON: "${{ inputs.fail-on }}"
        INPUT_FAIL_ON_DOMAIN: "${{ inputs.fail-on-domain }}"
        INPUT_ACTIVE_PROBE: "${{ inputs.active-probe }}"
        INPUT_ALLOW_PRIVATE_NETWORK: "${{ inputs.allow-private-network }}"
      run: |
        bash "$GITHUB_ACTION_PATH/scripts/run-action.sh"
outputs:
  report-json:
    description: "JSON report path; source mode uses finding/report v3 with technical and plain-language explanation"
    value: "${{ inputs.output-dir }}/report.json"
  report-markdown:
    description: "Markdown report path; proposals are review-only and are not applied by the Action"
    value: "${{ inputs.output-dir }}/report.md"
  report-sarif:
    description: "SARIF report path (source mode; crawl mode may omit it)"
    value: "${{ inputs.output-dir }}/report.sarif"
  report-junit:
    description: "JUnit report path (source mode; crawl mode may omit it)"
    value: "${{ inputs.output-dir }}/report.junit.xml"
