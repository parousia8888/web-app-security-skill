name: "npm publish"
on:
  workflow_dispatch:
    inputs:
      version:
        description: "Existing signed release version without the v prefix"
        required: true
        type: "string"
permissions:
  contents: "read"
  id-token: "write"
jobs:
  publish:
    runs-on: "ubuntu-latest"
    steps:
      - name: "Validate release input"
        shell: "bash"
        env:
          RELEASE_VERSION: "${{ inputs.version }}"
        run: |
          if [[ ! "$RELEASE_VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "version must be plain SemVer without a v prefix" >&2
            exit 1
          fi
      - uses: "actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803" # v6
        with:
          fetch-depth: 0
          ref: "refs/tags/v${{ inputs.version }}"
      - uses: "actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38" # v6
        with:
          node-version: "24"
          registry-url: "https://registry.npmjs.org"
      - name: "Use a trusted-publishing capable npm"
        run: "npm install --global npm@11.19.0"
      - name: "Verify immutable release identity"
        shell: "bash"
        env:
          RELEASE_VERSION: "${{ inputs.version }}"
        run: |
          version="$(tr -d '\n' < VERSION)"
          package_version="$(node -p "require('./package.json').version")"
          test "$version" = "$RELEASE_VERSION"
          test "$package_version" = "$RELEASE_VERSION"
          test "$(git rev-parse HEAD)" = "$(git rev-parse "v$version^{}")"
          git -c gpg.ssh.allowedSignersFile=.github/release-signers verify-tag "v$version"
      - name: "Publish with npm trusted publishing"
        run: "npm publish --provenance --access public"
