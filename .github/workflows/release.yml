name: "release"
on:
  push:
    tags:
      - "v[0-9]*.[0-9]*.[0-9]*"
permissions:
  contents: "write"
  id-token: "write"
  attestations: "write"
jobs:
  release:
    runs-on: "ubuntu-latest"
    steps:
      - uses: "actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803" # v6
        with:
          fetch-depth: 0
      - uses: "actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38" # v6
        with:
          node-version: "22"
      - run: "npm ci --ignore-scripts"
      - name: "Verify tag and release evidence"
        shell: "bash"
        run: |
          version="$(tr -d '\n' < VERSION)"
          test "$GITHUB_REF_NAME" = "v$version"
          test -f "docs/releases/v$version.md"
          npm run check
      - name: "Build source archive, SBOM, and checksums"
        shell: "bash"
        run: |
          version="$(tr -d '\n' < VERSION)"
          node scripts/build-release-artifacts.mjs --ref "$GITHUB_REF_NAME" --out dist
          node scripts/verify-release-artifacts.mjs \
            --manifest "dist/web-app-security-skill-$version.release.json"
          node scripts/test-release-artifact.mjs \
            --archive "dist/web-app-security-skill-$version.tar.gz"
          node scripts/build-release-artifacts.mjs --ref "$GITHUB_REF_NAME" --out dist-rebuild
          diff -u dist/SHA256SUMS dist-rebuild/SHA256SUMS
          for artifact in dist/*; do
            cmp "$artifact" "dist-rebuild/$(basename "$artifact")"
          done
          node scripts/prepare-release-promotion.mjs \
            --version "$version" --assets dist --out release-promotion.json
      - name: "Attest release artifacts"
        uses: "actions/attest-build-provenance@977bb373ede98d70efdf65b84cb5f73e068dcc2a" # v3
        with:
          subject-path: "dist/*"
      - name: "Publish GitHub release"
        env:
          GH_TOKEN: "${{ github.token }}"
        shell: "bash"
        run: |
          version="$(tr -d '\n' < VERSION)"
          gh release create "$GITHUB_REF_NAME" dist/* \
            --verify-tag \
            --title "$GITHUB_REF_NAME" \
            --notes-file "docs/releases/v$version.md"
      - name: "Upload release evidence"
        uses: "actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f" # v6
        with:
          name: "release-evidence-${{ github.ref_name }}"
          path: |
            dist/
            release-promotion.json
          if-no-files-found: "error"
