name: "Action v1 consumer"
on:
  workflow_dispatch:
permissions:
  contents: "read"
jobs:
  immutable-route-consumer:
    runs-on: "ubuntu-latest"
    steps:
      - uses: "actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803" # v6
      - uses: "actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38" # v6
        with:
          node-version: "22"
      - name: "Create owned NestJS route-control fixture"
        shell: "bash"
        run: |
          mkdir -p "$RUNNER_TEMP/v072-route-fixture/src"
          printf '%s\n' '{"private":true,"dependencies":{"@nestjs/common":"fixture","@nestjs/core":"fixture","@nestjs/passport":"fixture"}}' > "$RUNNER_TEMP/v072-route-fixture/package.json"
          printf '%s\n' '{"lockfileVersion":3}' > "$RUNNER_TEMP/v072-route-fixture/package-lock.json"
          cat > "$RUNNER_TEMP/v072-route-fixture/src/auth.guard.ts" <<'SOURCE'
          import { AuthGuard } from '@nestjs/passport';
          export class JwtAuthGuard extends AuthGuard('jwt') {}
          SOURCE
          cat > "$RUNNER_TEMP/v072-route-fixture/src/roles.guard.ts" <<'SOURCE'
          import { Reflector } from '@nestjs/core';
          export class RolesGuard {
            constructor(private reflector: Reflector) {}
            canActivate(context) {
              return this.reflector.getAllAndOverride('roles', [context.getHandler(), context.getClass()]);
            }
          }
          SOURCE
          cat > "$RUNNER_TEMP/v072-route-fixture/src/rate-limit.guard.ts" <<'SOURCE'
          export class RateLimitGuard { canActivate() { return true; } }
          SOURCE
          cat > "$RUNNER_TEMP/v072-route-fixture/src/app.module.ts" <<'SOURCE'
          import { APP_GUARD } from '@nestjs/core';
          import { RateLimitGuard } from './rate-limit.guard';
          export const providers = [{ provide: APP_GUARD, useClass: RateLimitGuard }];
          SOURCE
          cat > "$RUNNER_TEMP/v072-route-fixture/src/audit.controller.ts" <<'SOURCE'
          import { Controller, Get, Patch, UseGuards } from '@nestjs/common';
          import { JwtAuthGuard } from './auth.guard';
          import { RolesGuard } from './roles.guard';
          @Controller('admin')
          export class AuditController {
            @UseGuards(JwtAuthGuard, RolesGuard) @Get('audit') audit() {}
            @Patch('projects/:id') unguardedMutation() {}
          }
          SOURCE
      - name: "Consume immutable v0.7.2 Action"
        uses: "parousia8888/web-app-security-skill@30402c866b86d78b66d0d4b495fee40ff6a6f160"
        with:
          mode: "source"
          project: "${{ runner.temp }}/v072-route-fixture"
          adapters: "builtin"
          fail-on: "never"
          output-dir: "${{ runner.temp }}/v072-route-report"
      - name: "Verify route-security v2 control separation"
        shell: "bash"
        env:
          ROUTE_REPORT: "${{ runner.temp }}/v072-route-report"
        run: |
          node <<'NODE'
          const fs = require('node:fs');
          const path = require('node:path');
          const root = process.env.ROUTE_REPORT;
          const routes = JSON.parse(fs.readFileSync(path.join(root, 'route-security.json'), 'utf8'));
          const report = JSON.parse(fs.readFileSync(path.join(root, 'report.json'), 'utf8'));
          if (routes.schemaVersion !== 2) throw new Error(`expected route schema v2, got ${routes.schemaVersion}`);
          if (routes.routes.length !== 2) throw new Error(`expected two routes, got ${routes.routes.length}`);
          if (routes.applicationControls.length !== 1 || routes.applicationControls[0].origin !== 'RateLimitGuard') {
            throw new Error('global RateLimitGuard must be listed once as an application control');
          }
          const guarded = routes.routes.find((route) => route.method === 'GET');
          const unguarded = routes.routes.find((route) => route.method === 'PATCH');
          if (!guarded || !unguarded) throw new Error('expected GET and PATCH route identities');
          if (guarded.authentication.state !== 'local_observed'
              || guarded.authorization.state !== 'candidate_observed') {
            throw new Error('classified authentication and authorization signals were not separated');
          }
          if (guarded.authentication.signals.some((signal) => signal.origin === 'RateLimitGuard')
              || guarded.authorization.signals.some((signal) => signal.origin === 'RateLimitGuard')) {
            throw new Error('application rate limit leaked into route authentication or authorization');
          }
          if (unguarded.authentication.state !== 'not_observed'
              || unguarded.authorization.state !== 'not_observed'
              || unguarded.routeScopedControl.state !== 'no_route_scoped_control_observed') {
            throw new Error('unguarded state-changing object route was not kept in the review queue');
          }
          if (report.findings.some((finding) => finding.state === 'confirmed')) {
            throw new Error('route review created a confirmed vulnerability');
          }
          NODE
  consumer:
    runs-on: "ubuntu-latest"
    steps:
      - uses: "actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803" # v6
      - uses: "actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38" # v6
        with:
          node-version: "22"
      - name: "Start owned local fixture"
        shell: "bash"
        run: |
          nohup node -e '
            const fs = require("node:fs");
            const http = require("node:http");
            const log = process.env.REQUEST_LOG;
            http.createServer((request, response) => {
              fs.appendFileSync(log, `${request.url}\n`);
              if (request.url === "/robots.txt") {
                response.writeHead(200, { "content-type": "text/plain" });
                response.end("User-agent: *\nAllow: /\n");
              } else if (request.url === "/") {
                response.writeHead(200, { "content-type": "text/html" });
                response.end(`<html><body>${"owned fixture ".repeat(300)}</body></html>`);
              } else {
                response.writeHead(404, { "content-type": "text/plain" });
                response.end("not found");
              }
            }).listen(4173, "127.0.0.1");
          ' >"$RUNNER_TEMP/action-v1-server.log" 2>&1 &
          echo "$!" > "$RUNNER_TEMP/action-v1-server.pid"
          for attempt in 1 2 3 4 5; do
            curl --fail --silent "http://127.0.0.1:4173/" >/dev/null && exit 0
            sleep 1
          done
          exit 1
        env:
          REQUEST_LOG: "${{ runner.temp }}/action-v1-requests.log"
      - name: "Consume the stable major Action"
        uses: "parousia8888/web-app-security-skill@v1"
        with:
          site: "http://127.0.0.1:4173"
          acknowledge-authorization: "true"
          active-probe: "false"
          allow-private-network: "true"
          fail-on: "never"
          output-dir: "action-v1-success"
      - name: "Verify passive success evidence"
        shell: "bash"
        run: |
          test -s action-v1-success/report.json
          test -s action-v1-success/report.md
          if grep -Fx '/.env' "$RUNNER_TEMP/action-v1-requests.log"; then
            echo "passive Action requested an active-probe path" >&2
            exit 1
          fi
      - name: "Exercise authorization rejection"
        id: "denied"
        continue-on-error: true
        uses: "parousia8888/web-app-security-skill@v1"
        with:
          site: "http://127.0.0.1:4173"
          acknowledge-authorization: "false"
          active-probe: "false"
          fail-on: "never"
          output-dir: "action-v1-denied"
      - name: "Verify authorization rejection"
        shell: "bash"
        env:
          DENIED_OUTCOME: "${{ steps.denied.outcome }}"
        run: |
          test "$DENIED_OUTCOME" = "failure"
          test ! -e action-v1-denied/report.json
      - name: "Stop fixture"
        if: "always()"
        shell: "bash"
        run: |
          if test -f "$RUNNER_TEMP/action-v1-server.pid"; then
            kill "$(cat "$RUNNER_TEMP/action-v1-server.pid")" 2>/dev/null || true
          fi
  live-verification:
    needs: [immutable-route-consumer, consumer]
    permissions:
      contents: "write"
    runs-on: "ubuntu-latest"
    env:
      GH_TOKEN: "${{ github.token }}"
      WEBAPP_SECURITY_IMMUTABLE_CONSUMER_RESULT: "${{ needs.immutable-route-consumer.result }}"
      WEBAPP_SECURITY_STABLE_CONSUMER_RESULT: "${{ needs.consumer.result }}"
    steps:
      - uses: "actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803" # v6
        with:
          fetch-depth: 0
      - uses: "actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38" # v6
        with:
          node-version: "22"
      - run: "npm ci --ignore-scripts"
      - name: "Download and verify public release, package and moving alias"
        shell: "bash"
        run: |
          set -euo pipefail
          version="$(node -p "require('./docs/release-state.json').publishedRelease.version")"
          tag="v$version"
          mkdir -p live-evidence/release-assets
          gh release download "$tag" --dir live-evidence/release-assets
          node scripts/prepare-release-promotion.mjs \
            --version "$version" --assets live-evidence/release-assets --live \
            --out live-evidence/release-promotion.json
          node scripts/check-public-release-state.mjs \
            --out live-evidence/public-release-state.json
          npm view "web-app-security-skill@$version" --json > live-evidence/npm-metadata.json
          node scripts/check-public-package.mjs \
            --metadata live-evidence/npm-metadata.json --out live-evidence/public-package.json
      - name: "Exercise verified installer with required attestation"
        shell: "bash"
        run: |
          set -euo pipefail
          version="$(node -p "require('./docs/release-state.json').publishedRelease.version")"
          mkdir -p "$RUNNER_TEMP/live-install-home"
          HOME="$RUNNER_TEMP/live-install-home" node scripts/install-verified.mjs \
            --version "$version" --from-dir live-evidence/release-assets \
            --attestation required --target all | tee live-evidence/installer.log
      - name: "Build and publish durable live-verification evidence"
        shell: "bash"
        run: |
          set -euo pipefail
          version="$(node -p "require('./docs/release-state.json').publishedRelease.version")"
          tag="v$version"
          record="live-evidence/web-app-security-skill-$version.live-verification.json"
          node scripts/build-live-verification-record.mjs \
            --promotion live-evidence/release-promotion.json \
            --public-state live-evidence/public-release-state.json \
            --package-state live-evidence/public-package.json \
            --installer-log live-evidence/installer.log --out "$record"
          local_digest="sha256:$(sha256sum "$record" | cut -d ' ' -f 1)"
          remote_digest="$(gh release view "$tag" --json assets --jq \
            ".assets[] | select(.name == \"$(basename "$record")\") | .digest" || true)"
          if test -z "$remote_digest"; then
            gh release upload "$tag" "$record"
          elif test "$remote_digest" != "$local_digest"; then
            echo "existing live-verification record differs from this verified rerun" >&2
            exit 1
          fi
      - name: "Upload live-verification workflow evidence"
        uses: "actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f" # v6
        with:
          name: "live-verification"
          path: "live-evidence/"
          if-no-files-found: "error"
          retention-days: 90
