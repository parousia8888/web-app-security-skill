name: "Action v1 consumer"
on:
  workflow_dispatch:
    inputs:
      phase:
        description: "Verify the immutable Action, pending v1 promotion, or finalized public state"
        required: true
        default: "immutable-only"
        type: "choice"
        options:
          - "immutable-only"
          - "promotion"
          - "final"
      promotion-run-id:
        description: "Successful promotion-phase run ID; required only for final"
        required: false
        type: "string"
permissions:
  contents: "read"
concurrency:
  group: "action-v1-promotion"
  cancel-in-progress: false
jobs:
  immutable-route-consumer:
    if: "${{ inputs.phase != 'final' }}"
    runs-on: "ubuntu-latest"
    steps:
      - uses: "actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803" # v6
      - uses: "actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38" # v6
        with:
          node-version: "22"
      - name: "Create owned Express bounded-access fixture"
        shell: "bash"
        run: |
          mkdir -p "$RUNNER_TEMP/v081-access-fixture/src"
          printf '%s\n' '{"private":true,"dependencies":{"@clerk/nextjs":"fixture","@prisma/client":"fixture","express":"fixture"}}' > "$RUNNER_TEMP/v081-access-fixture/package.json"
          printf '%s\n' '{"lockfileVersion":3}' > "$RUNNER_TEMP/v081-access-fixture/package-lock.json"
          cat > "$RUNNER_TEMP/v081-access-fixture/src/project-repository.ts" <<'SOURCE'
          import { PrismaClient } from '@prisma/client';
          const prisma = new PrismaClient();
          export function loadProject(projectId, principalId) {
            return prisma.project.findFirst({ where: { id: projectId, ownerId: principalId } });
          }
          SOURCE
          cat > "$RUNNER_TEMP/v081-access-fixture/src/app.ts" <<'SOURCE'
          import express from 'express';
          import { currentUser } from '@clerk/nextjs/server';
          import { loadProject } from './project-repository';
          const app = express();
          app.get('/projects/:id', async (req, res) => {
            const principal = await currentUser();
            return res.json(await loadProject(req.params.id, principal.id));
          });
          SOURCE
      - name: "Consume immutable v0.8.1 Action"
        uses: "parousia8888/web-app-security-skill@6e581adcac7a0433ec6428d8080d20761dfc3a93"
        with:
          mode: "source"
          project: "${{ runner.temp }}/v081-access-fixture"
          adapters: "builtin"
          fail-on: "never"
          output-dir: "${{ runner.temp }}/v081-access-report"
      - name: "Verify route-security v3 bounded access path"
        shell: "bash"
        env:
          ROUTE_REPORT: "${{ runner.temp }}/v081-access-report"
        run: |
          node <<'NODE'
          const fs = require('node:fs');
          const path = require('node:path');
          const root = process.env.ROUTE_REPORT;
          const routes = JSON.parse(fs.readFileSync(path.join(root, 'route-security.json'), 'utf8'));
          const report = JSON.parse(fs.readFileSync(path.join(root, 'report.json'), 'utf8'));
          if (routes.schemaVersion !== 3 || routes.analyzer.revision !== '3') {
            throw new Error(`expected route schema/analyzer v3, got ${routes.schemaVersion}/${routes.analyzer.revision}`);
          }
          if (routes.accessPathCoverage.status !== 'completed') {
            throw new Error(`expected completed access-path coverage, got ${routes.accessPathCoverage.status}`);
          }
          const route = routes.routes.find((item) => item.method === 'GET' && item.path === '/projects/:id');
          if (!route || route.accessChains.length !== 1) throw new Error('expected one object-addressed route and chain');
          const chain = route.accessChains[0];
          if (chain.status !== 'completed' || chain.outcome !== 'authorization_constraint_observed') {
            throw new Error(`expected a completed constrained chain, got ${chain.status}/${chain.outcome}`);
          }
          if (chain.objectSelectors[0]?.origin !== 'request_selected'
              || !chain.callEdges.some((edge) => edge.kind === 'local_import')
              || chain.dataOperation?.provider !== 'prisma'
              || chain.dataOperation?.objectConstraint !== 'observed'
              || chain.dataOperation?.principalConstraint !== 'observed'
              || !chain.authorizationEvidence.some((item) =>
                item.kind === 'query_predicate' && item.category === 'principal' && item.field === 'ownerId')) {
            throw new Error('bounded selector/call/query evidence is incomplete');
          }
          if (report.findings.some((finding) => finding.state === 'confirmed')) {
            throw new Error('bounded access review created a confirmed vulnerability');
          }
          NODE
  consumer:
    if: "${{ inputs.phase == 'promotion' }}"
    runs-on: "ubuntu-latest"
    steps:
      - uses: "actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803" # v6
      - uses: "actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38" # v6
        with:
          node-version: "22"
      - name: "Start owned local fixture"
        shell: "bash"
        run: |
          nohup node -e '
            const fs = require("node:fs");
            const http = require("node:http");
            const log = process.env.REQUEST_LOG;
            http.createServer((request, response) => {
              fs.appendFileSync(log, `${request.url}\n`);
              if (request.url === "/robots.txt") {
                response.writeHead(200, { "content-type": "text/plain" });
                response.end("User-agent: *\nAllow: /\n");
              } else if (request.url === "/") {
                response.writeHead(200, { "content-type": "text/html" });
                response.end(`<html><body>${"owned fixture ".repeat(300)}</body></html>`);
              } else {
                response.writeHead(404, { "content-type": "text/plain" });
                response.end("not found");
              }
            }).listen(4173, "127.0.0.1");
          ' >"$RUNNER_TEMP/action-v1-server.log" 2>&1 &
          echo "$!" > "$RUNNER_TEMP/action-v1-server.pid"
          for attempt in 1 2 3 4 5; do
            curl --fail --silent "http://127.0.0.1:4173/" >/dev/null && exit 0
            sleep 1
          done
          exit 1
        env:
          REQUEST_LOG: "${{ runner.temp }}/action-v1-requests.log"
      - name: "Consume the stable major Action"
        uses: "parousia8888/web-app-security-skill@v1"
        with:
          site: "http://127.0.0.1:4173"
          acknowledge-authorization: "true"
          active-probe: "false"
          allow-private-network: "true"
          fail-on: "never"
          output-dir: "action-v1-success"
      - name: "Verify passive success evidence"
        shell: "bash"
        run: |
          test -s action-v1-success/report.json
          test -s action-v1-success/report.md
          if grep -Fx '/.env' "$RUNNER_TEMP/action-v1-requests.log"; then
            echo "passive Action requested an active-probe path" >&2
            exit 1
          fi
      - name: "Exercise authorization rejection"
        id: "denied"
        continue-on-error: true
        uses: "parousia8888/web-app-security-skill@v1"
        with:
          site: "http://127.0.0.1:4173"
          acknowledge-authorization: "false"
          active-probe: "false"
          fail-on: "never"
          output-dir: "action-v1-denied"
      - name: "Verify authorization rejection"
        shell: "bash"
        env:
          DENIED_OUTCOME: "${{ steps.denied.outcome }}"
        run: |
          test "$DENIED_OUTCOME" = "failure"
          test ! -e action-v1-denied/report.json
      - name: "Stop fixture"
        if: "always()"
        shell: "bash"
        run: |
          if test -f "$RUNNER_TEMP/action-v1-server.pid"; then
            kill "$(cat "$RUNNER_TEMP/action-v1-server.pid")" 2>/dev/null || true
          fi
  promotion-verification:
    needs: [immutable-route-consumer, consumer]
    if: "${{ always() && inputs.phase == 'promotion' && needs.immutable-route-consumer.result == 'success' && needs.consumer.result == 'success' }}"
    permissions:
      contents: "read"
    runs-on: "ubuntu-latest"
    env:
      GH_TOKEN: "${{ github.token }}"
      WEBAPP_SECURITY_IMMUTABLE_CONSUMER_RESULT: "${{ needs.immutable-route-consumer.result }}"
      WEBAPP_SECURITY_STABLE_CONSUMER_RESULT: "${{ needs.consumer.result }}"
    steps:
      - uses: "actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803" # v6
        with:
          fetch-depth: 0
      - uses: "actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38" # v6
        with:
          node-version: "22"
      - run: "npm ci --ignore-scripts"
      - name: "Download and verify immutable channels and pending moving alias"
        shell: "bash"
        run: |
          set -euo pipefail
          version="$(node -p "require('./docs/release-state.json').publishedRelease.version")"
          tag="v$version"
          mkdir -p live-evidence/release-assets
          gh release download "$tag" --dir live-evidence/release-assets
          node scripts/prepare-release-promotion.mjs \
            --version "$version" --assets live-evidence/release-assets --live \
            --out live-evidence/release-promotion.json
          node scripts/check-public-release-state.mjs --phase pending \
            --out live-evidence/public-release-state.json
          npm view "web-app-security-skill@$version" --json > live-evidence/npm-metadata.json
          node scripts/check-public-package.mjs \
            --metadata live-evidence/npm-metadata.json --out live-evidence/public-package.json
      - name: "Exercise verified installer with required attestation"
        shell: "bash"
        run: |
          set -euo pipefail
          version="$(node -p "require('./docs/release-state.json').publishedRelease.version")"
          mkdir -p "$RUNNER_TEMP/live-install-home"
          HOME="$RUNNER_TEMP/live-install-home" node scripts/install-verified.mjs \
            --version "$version" --from-dir live-evidence/release-assets \
            --attestation required --target all | tee live-evidence/installer.log
      - name: "Record successful pending-promotion consumers"
        shell: "bash"
        run: |
          set -euo pipefail
          version="$(node -p "require('./docs/release-state.json').publishedRelease.version")"
          node - <<'NODE' > live-evidence/consumer-results.json
          const state = require('./docs/release-state.json');
          if (state.stableAction?.promotion?.state !== 'pending') {
            throw new Error('promotion phase requires pending stable Action state');
          }
          process.stdout.write(`${JSON.stringify({
            schemaVersion: 1,
            state: 'promotion_consumers_verified',
            runId: process.env.GITHUB_RUN_ID,
            workflow: '.github/workflows/action-v1-consumer.yml',
            version: state.publishedRelease.version,
            sourceCommit: state.stableAction.promotion.expectedSourceCommit,
            pendingStateCommit: process.env.GITHUB_SHA,
            immutableConsumer: process.env.WEBAPP_SECURITY_IMMUTABLE_CONSUMER_RESULT,
            stableConsumer: process.env.WEBAPP_SECURITY_STABLE_CONSUMER_RESULT,
          }, null, 2)}\n`);
          NODE
      - name: "Upload pending-promotion workflow evidence"
        uses: "actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f" # v6
        with:
          name: "action-v1-promotion-${{ github.run_id }}"
          path: "live-evidence/"
          if-no-files-found: "error"
          retention-days: 90
  final-state-verification:
    if: "${{ inputs.phase == 'final' }}"
    environment: "release"
    permissions:
      actions: "read"
      contents: "write"
    runs-on: "ubuntu-latest"
    env:
      GH_TOKEN: "${{ github.token }}"
      PROMOTION_RUN_ID: "${{ inputs['promotion-run-id'] }}"
    steps:
      - uses: "actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803" # v6
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: "actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38" # v6
        with:
          node-version: "22"
      - run: "npm ci --ignore-scripts"
      - name: "Download and bind the successful promotion run"
        shell: "bash"
        run: |
          set -euo pipefail
          if [[ ! "$PROMOTION_RUN_ID" =~ ^[0-9]+$ ]]; then
            echo "final phase requires a numeric promotion-run-id" >&2
            exit 1
          fi
          gh run view "$PROMOTION_RUN_ID" \
            --json databaseId,workflowName,event,conclusion,headSha,url \
            > promotion-run.json
          node - <<'NODE'
          const run = require('./promotion-run.json');
          if (String(run.databaseId) !== process.env.PROMOTION_RUN_ID
              || run.workflowName !== 'Action v1 consumer'
              || run.event !== 'workflow_dispatch'
              || run.conclusion !== 'success') {
            throw new Error('promotion run identity or conclusion disagrees');
          }
          NODE
          mkdir prior-evidence
          gh run download "$PROMOTION_RUN_ID" \
            --name "action-v1-promotion-$PROMOTION_RUN_ID" --dir prior-evidence
      - name: "Verify finalized tracked state against prior consumers"
        shell: "bash"
        run: |
          set -euo pipefail
          mkdir live-evidence
          node scripts/check-public-release-state.mjs --phase final \
            --out live-evidence/public-release-state.json
          node - <<'NODE'
          const fs = require('node:fs');
          const state = require('./docs/release-state.json');
          const run = require('./promotion-run.json');
          const consumers = require('./prior-evidence/consumer-results.json');
          if (state.stableAction?.promotion?.state !== 'final'
              || consumers.state !== 'promotion_consumers_verified'
              || consumers.runId !== process.env.PROMOTION_RUN_ID
              || consumers.pendingStateCommit !== run.headSha
              || consumers.version !== state.publishedRelease.version
              || consumers.sourceCommit !== state.stableAction.sourceCommit
              || consumers.immutableConsumer !== 'success'
              || consumers.stableConsumer !== 'success') {
            throw new Error('final stable state disagrees with pending-promotion consumer evidence');
          }
          for (const name of ['release-promotion.json', 'public-package.json', 'installer.log']) {
            fs.copyFileSync(`prior-evidence/${name}`, `live-evidence/${name}`);
          }
          NODE
      - name: "Build and publish durable live-verification evidence"
        shell: "bash"
        env:
          WEBAPP_SECURITY_IMMUTABLE_CONSUMER_RESULT: "success"
          WEBAPP_SECURITY_STABLE_CONSUMER_RESULT: "success"
        run: |
          set -euo pipefail
          version="$(node -p "require('./docs/release-state.json').publishedRelease.version")"
          tag="v$version"
          record="live-evidence/web-app-security-skill-$version.live-verification.json"
          node scripts/build-live-verification-record.mjs \
            --promotion live-evidence/release-promotion.json \
            --public-state live-evidence/public-release-state.json \
            --package-state live-evidence/public-package.json \
            --installer-log live-evidence/installer.log --out "$record"
          local_digest="sha256:$(sha256sum "$record" | cut -d ' ' -f 1)"
          remote_digest="$(gh release view "$tag" --json assets --jq \
            ".assets[] | select(.name == \"$(basename "$record")\") | .digest" || true)"
          if test -z "$remote_digest"; then
            gh release upload "$tag" "$record"
          elif test "$remote_digest" != "$local_digest"; then
            echo "existing live-verification record differs from this verified rerun" >&2
            exit 1
          fi
      - name: "Upload finalized live-verification evidence"
        uses: "actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f" # v6
        with:
          name: "live-verification-${{ inputs['promotion-run-id'] }}"
          path: |
            live-evidence/
            promotion-run.json
            prior-evidence/consumer-results.json
          if-no-files-found: "error"
          retention-days: 90
