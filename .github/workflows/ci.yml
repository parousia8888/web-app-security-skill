name: ci
on: [push, pull_request]
jobs:
  test:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]   # macOS ships Bash 3.2
        node: ['22', '24']
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0 # verify immutable installer trust anchors from repository history
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with: { node-version: '${{ matrix.node }}' }
      - run: npm ci --ignore-scripts
      - run: npm run lint
      - run: npm test                        # unit + robots + real-CLI integration (fixture)
      - run: bash test/shell-smoke.sh        # real gate: exit codes + Bash 3.2, no `|| true`
      - name: Install checksum-pinned external adapters
        if: matrix.os == 'ubuntu-latest' && matrix.node == '22'
        run: bash test/install-pinned-adapters.sh
      - name: Run real external adapter fixtures
        if: matrix.os == 'ubuntu-latest' && matrix.node == '22'
        env:
          WEBAPP_SECURITY_REAL_ADAPTER_TEST: "true"
        run: node test/real-adapters.test.mjs
